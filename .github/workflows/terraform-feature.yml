name: Terraform Feature CI

on:
  push:
    branches:
      - 'feature/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-check:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Environment/asset-dev

        steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          tflint --init
          tflint

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: Environment/asset-dev

       - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: Environment/asset-dev
          framework: terraform