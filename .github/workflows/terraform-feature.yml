name: Terraform Feature CI

on:
  push:
    branches:
      - feature/terraform-ci

  pull_request:
    branches:
      - feature/terraform-ci

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:

  terraform-check:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Environment/asset-dev

    steps:

      # ==================================================
      # 1. Checkout Code
      # ==================================================
      - name: Checkout Code
        uses: actions/checkout@v4


      # ==================================================
      # 2. Setup Terraform
      # ==================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8


      # ==================================================
      # 3. Terraform Format Check
      # ==================================================
      - name: Terraform Format Check
        run: terraform fmt -check -recursive


      # ==================================================
      # 4. Terraform Init
      # ==================================================
      - name: Terraform Init
        run: terraform init -backend=false


      # ==================================================
      # 5. Terraform Validate
      # ==================================================
      - name: Terraform Validate
        run: terraform validate


      # ==================================================
      # 6. Setup TFLint
      # ==================================================
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4


      # ==================================================
      # 7. Run TFLint
      # ==================================================
      - name: Run TFLint
        run: |
          tflint --init
          tflint


      # ==================================================
      # 8. Run tfsec
      # ==================================================
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: Environment/asset-dev


      # ==================================================
      # 9. Run Checkov
      # ==================================================
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: Environment/asset-dev
          framework: terraform
          quiet: true


      # ==================================================
      # 10. Run GitLeaks
      # ==================================================
      # We don't use gitleaks-action here because it was
      # failing while creating results.sarif.
      # The report is written to RUNNER_TEMP instead.
      # ==================================================
      - name: Run GitLeaks
        working-directory: .
        shell: bash
        run: |
          GITLEAKS_VERSION="8.24.3"

          echo "Downloading Gitleaks ${GITLEAKS_VERSION}..."

          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz

          echo "Extracting Gitleaks..."

          tar -xzf /tmp/gitleaks.tar.gz -C /tmp

          echo "Running Gitleaks..."

          /tmp/gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --exit-code 2 \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks-results.sarif"


      # ==================================================
      # 11. Upload GitLeaks Report
      # ==================================================
      - name: Upload GitLeaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: ${{ runner.temp }}/gitleaks-results.sarif
          if-no-files-found: warn


      # ==================================================
      # 12. Setup Infracost
      # ==================================================
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}


      # ==================================================
      # 13. Run Infracost
      # ==================================================
      - name: Run Infracost
        run: |
          infracost breakdown \
            --path=. \
            --format=json \
            --out-file=/tmp/infracost.json


      # ==================================================
      # 14. Display Infracost
      # ==================================================
      - name: Display Infracost
        run: |
          infracost output \
            --path=/tmp/infracost.json \
            --format=table


      # ==================================================
      # 15. Terraform Plan
      # ==================================================
      - name: Terraform Plan
        run: |
          terraform plan \
            -out=tfplan


      # ==================================================
      # 16. Upload Terraform Plan
      # ==================================================
      - name: Upload Terraform Plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: Environment/asset-dev/tfplan
          if-no-files-found: warn