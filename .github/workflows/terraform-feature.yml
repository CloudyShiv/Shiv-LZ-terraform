name: Terraform Feature CI

on:
  push:
    branches:
      - feature/terraform-ci

  pull_request:
    branches:
      - feature/terraform-ci

  workflow_dispatch:

jobs:

  terraform-check:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Environment/asset-dev

    permissions:
      contents: read
      security-events: write

    steps:

      # =========================================
      # 1. CHECKOUT CODE
      # =========================================

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =========================================
      # 2. SETUP TERRAFORM
      # =========================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # =========================================
      # 3. TERRAFORM FORMAT CHECK
      # =========================================

      - name: Terraform Format Check
        run: terraform fmt -check -recursive


      # =========================================
      # 4. TERRAFORM INIT
      # =========================================

      - name: Terraform Init
        run: terraform init -backend=false


      # =========================================
      # 5. TERRAFORM VALIDATE
      # =========================================

      - name: Terraform Validate
        run: terraform validate


      # =========================================
      # 6. SETUP TFLINT
      # =========================================

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4


      # =========================================
      # 7. RUN TFLINT
      # =========================================

      - name: Run TFLint
        run: |
          tflint --init
          tflint


      # =========================================
      # 8. RUN TFSEC
      # =========================================

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: Environment/asset-dev


      # =========================================
      # 9. RUN CHECKOV
      # =========================================

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: Environment/asset-dev
          framework: terraform


      # =========================================
      # 10. INSTALL GITLEAKS
      # =========================================

      - name: Install GitLeaks
        working-directory: ${{ github.workspace }}
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz

          tar -xzf /tmp/gitleaks.tar.gz -C /tmp

          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

          gitleaks version


      # =========================================
      # 11. RUN GITLEAKS SECRET SCAN
      # =========================================

      - name: Run GitLeaks
        working-directory: ${{ github.workspace }}
        run: |
          echo "========================================="
          echo "Running GitLeaks Secret Scan"
          echo "========================================="

          gitleaks detect \
            --redact \
            --verbose \
            --exit-code=1 \
            --report-format=sarif \
            --report-path="$RUNNER_TEMP/gitleaks-results.sarif"

          echo "========================================="
          echo "GitLeaks scan completed successfully"
          echo "========================================="


      # =========================================
      # 12. UPLOAD GITLEAKS REPORT
      # =========================================

      - name: Upload GitLeaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: ${{ runner.temp }}/gitleaks-results.sarif
          if-no-files-found: warn


      # =========================================
      # 13. UPLOAD TERRAFORM FILES
      # =========================================

      - name: Upload Terraform Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-files
          path: |
            Environment/asset-dev/*.tf
            Environment/asset-dev/.terraform.lock.hcl